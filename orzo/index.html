<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4A2C1A">
<title>Creamy Sun-Dried Tomato Chicken Orzo</title>
<style>
@font-face { font-family: Fraunces; src: url(fonts/fraunces.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: Nunito; src: url(fonts/nunito.woff2) format('woff2'); font-weight: 200 1000; font-display: block; }
:root { --cream:#FBF3E4; --paper:#FFFDF7; --tomato:#D8432E; --basil:#5E8C3A; --gold:#E9A923; --ink:#4A2C1A; --line:#E8D9BC; --soft:#F3E6CD; --muted:#8A6E57; --dark:#2E1B10; }
html, body { margin:0; height:100%; background:var(--dark); overflow:hidden; }
body { font-family: Nunito, -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; background:var(--cream); color:var(--ink); transform-origin:0 0; }
[data-layout=tall] #stage { width:1080px; height:1920px; }
#bar { position:absolute; left:0; top:0; height:10px; background:var(--tomato); width:0; z-index:5; }
#subs { position:absolute; left:0; right:0; bottom:0; height:130px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 120px; font-size:38px; line-height:1.3; font-weight:600; color:var(--cream); background:var(--ink); }
[data-layout=tall] #subs { height:180px; padding:0 50px; font-size:44px; }
[data-layout=tall] #subs.long { font-size:35px; }
.scene { position:absolute; left:0; right:0; top:10px; bottom:130px; display:none; flex-direction:column; }
[data-layout=tall] .scene { bottom:180px; }
.scene.on { display:flex; }
svg .a, svg .lp { transform-box:fill-box; transform-origin:center; }
svg text { font-family: Nunito, sans-serif; }

/* header */
.hdr { display:flex; align-items:center; gap:28px; padding:34px 70px 10px; flex:none; }
.pill { background:var(--tomato); color:#fff; font-weight:800; font-size:34px; padding:10px 30px; border-radius:999px; white-space:nowrap; }
.ttl { font-family:Fraunces, serif; font-weight:600; font-size:58px; letter-spacing:-0.5px; white-space:nowrap; }
.cnt { margin-left:auto; font-size:34px; font-weight:800; color:var(--muted); white-space:nowrap; }
[data-layout=tall] .hdr { padding:40px 50px 10px; gap:24px; }
[data-layout=tall] .pill { font-size:34px; padding:10px 26px; }
[data-layout=tall] .ttl { font-size:54px; }
[data-layout=tall] .cnt { font-size:38px; }

/* cook scene: drawing + action panel */
.body { flex:1; display:flex; min-height:0; }
.art { flex:0 0 1010px; display:flex; align-items:center; justify-content:center; padding-left:40px; box-sizing:border-box; min-height:0; }
.art svg { width:100%; height:100%; max-height:800px; display:block; }
.info { flex:1; padding:34px 70px 20px 30px; min-width:0; }
[data-layout=tall] .body { flex-direction:column; }
[data-layout=tall] .art { flex:0 0 790px; padding:0 30px; }
[data-layout=tall] .info { padding:10px 56px 0; }
.head { font-family:Fraunces, serif; font-weight:600; font-size:66px; line-height:1.12; letter-spacing:-0.5px; margin-bottom:28px; }
[data-layout=tall] .head { font-size:76px; }
.chips { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:28px; }
.chip { background:var(--paper); border:3px solid var(--line); border-radius:20px; padding:10px 24px; font-size:38px; font-weight:600; }
.chip b { color:var(--tomato); font-weight:800; margin-right:6px; }
[data-layout=tall] .chip { font-size:46px; padding:12px 26px; }
.tip { background:#FFF1C2; border:3px solid var(--gold); border-radius:24px; padding:18px 28px 20px; max-width:770px; margin-bottom:24px; box-sizing:border-box; }
.tip-term { font-family:Fraunces, serif; font-weight:700; font-size:42px; color:#7A4B00; display:flex; align-items:center; gap:14px; }
.tip-term svg { width:42px; height:42px; flex:none; }
.tip-def { font-size:36px; line-height:1.3; margin-top:6px; color:#5A3A10; font-weight:600; }
[data-layout=tall] .tip { max-width:none; }
[data-layout=tall] .tip-term { font-size:48px; }
[data-layout=tall] .tip-term svg { width:48px; height:48px; }
[data-layout=tall] .tip-def { font-size:42px; }
.timer { display:flex; align-items:center; gap:26px; background:var(--paper); border:4px solid var(--tomato); border-radius:26px; padding:16px 34px 16px 20px; margin-bottom:26px; width:fit-content; }
.ring { width:120px; height:120px; flex:none; }
.ring .trk { fill:none; stroke:var(--soft); stroke-width:12; }
.ring .arc { fill:none; stroke:var(--tomato); stroke-width:12; stroke-linecap:round; }
.ring .hand { stroke:var(--ink); stroke-width:6; stroke-linecap:round; fill:none; }
.tm-big { font-family:Fraunces, serif; font-weight:700; font-size:54px; line-height:1; }
.tm-sub { font-size:32px; font-weight:700; color:var(--muted); margin-top:6px; }
.tm-live { display:none; font-size:32px; font-weight:800; color:var(--tomato); margin-top:6px; font-variant-numeric:tabular-nums; }
.live .tm-live { display:block; }
.live .timer, .live .ck { cursor:pointer; }
[data-layout=tall] .ring { width:140px; height:140px; }
[data-layout=tall] .tm-big { font-size:64px; }
[data-layout=tall] .tm-sub, [data-layout=tall] .tm-live { font-size:38px; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-bottom:26px; }
.stat { background:var(--paper); border:3px solid var(--line); border-radius:26px; padding:26px 16px; text-align:center; }
.stat .num { font-family:Fraunces, serif; font-weight:700; font-size:64px; color:var(--tomato); line-height:1; white-space:nowrap; }
.stat .unit { font-size:34px; font-weight:800; margin-top:12px; }
[data-layout=tall] .stat .num { font-size:76px; }
[data-layout=tall] .stat .unit { font-size:40px; }

/* get-ready checklist */
.ready { flex:1; display:grid; grid-template-columns:1.25fr 0.9fr 1.15fr 1.05fr; gap:10px 40px; padding:18px 70px; align-content:start; }
.grp h3 { font-family:Fraunces, serif; font-size:40px; font-weight:700; color:var(--tomato); margin:0 0 10px; }
.ck { display:flex; align-items:flex-start; gap:16px; font-size:32px; line-height:1.25; font-weight:600; padding:9px 0; }
.ck .box { flex:none; width:40px; height:40px; border:4px solid var(--ink); border-radius:10px; background:var(--paper); box-sizing:border-box; }
.ck svg { width:100%; height:100%; display:block; }
.tick { fill:none; stroke:var(--basil); stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round; opacity:0; }
.ck.done .tick { opacity:1; }
.ck.done .lbl { opacity:.5; }
.ck b { font-weight:800; }
[data-layout=tall] .ready { grid-template-columns:1fr 1fr; padding:24px 50px; gap:34px 36px; }
[data-layout=tall] .grp h3 { font-size:46px; }
[data-layout=tall] .ck { font-size:36px; padding:11px 0; }
[data-layout=tall] .ck .box { width:46px; height:46px; }
[data-layout=tall] .g0 { grid-column:1; grid-row:1; }
[data-layout=tall] .g1 { grid-column:1; grid-row:2; }
[data-layout=tall] .g2 { grid-column:2; grid-row:1; }
[data-layout=tall] .g3 { grid-column:2; grid-row:2; }

/* title and end */
.title-wrap { flex:1; display:flex; align-items:center; min-height:0; }
.hero { flex:0 0 880px; padding-left:70px; box-sizing:border-box; }
.hero svg { width:100%; height:auto; display:block; }
.title-txt { flex:1; padding:0 90px 0 50px; }
.kicker { font-size:36px; font-weight:800; color:var(--tomato); text-transform:uppercase; letter-spacing:3px; }
.title-txt h1 { font-family:Fraunces, serif; font-weight:700; font-size:100px; line-height:1.03; margin:18px 0 28px; letter-spacing:-2px; }
.sub { font-size:44px; font-weight:700; color:var(--muted); line-height:1.3; }
[data-layout=tall] .title-wrap { flex-direction:column; justify-content:center; text-align:center; }
[data-layout=tall] .hero { flex:none; width:900px; padding:0; }
[data-layout=tall] .title-txt { flex:none; padding:40px 60px 0; }
[data-layout=tall] .title-txt h1 { font-size:108px; }
[data-layout=tall] .sub { font-size:50px; }

/* live controls (real pixels, outside the scaled stage) */
#ctl { display:none; }
.live #ctl { display:block; position:fixed; left:0; right:0; bottom:0; background:var(--dark); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); z-index:20; }
#btns { display:flex; gap:8px; max-width:900px; margin:0 auto; }
#btns button { flex:1; height:60px; border:0; border-radius:16px; font:800 18px Nunito, sans-serif; background:#5A3A26; color:var(--cream); cursor:pointer; }
#btns #b-next { flex:2.2; background:var(--tomato); color:#fff; font-size:22px; }
#btns button:disabled { opacity:.35; }
.wait #b-next:not(:disabled) { animation:nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { background:#F0603F; transform:scale(1.02); } }
#tray { display:flex; flex-wrap:wrap; gap:6px; max-width:900px; margin:0 auto; }
#tray:not(:empty) { margin-bottom:8px; }
.tchip { display:flex; align-items:center; gap:8px; background:var(--cream); color:var(--ink); border-radius:12px; padding:6px 6px 6px 12px; font:700 15px Nunito, sans-serif; }
.tchip b { font:800 18px Nunito, sans-serif; font-variant-numeric:tabular-nums; color:var(--tomato); }
.tchip.rung { background:var(--tomato); color:#fff; animation:ring .7s ease-in-out infinite alternate; }
.tchip.rung b { color:#fff; }
@keyframes ring { to { background:#F0603F; } }
.tchip button { border:0; width:30px; height:30px; border-radius:8px; background:rgba(74,44,26,.14); color:inherit; font:800 18px/1 Nunito, sans-serif; cursor:pointer; }
#start { position:fixed; inset:0; background:rgba(46,27,16,.88); z-index:30; display:flex; align-items:center; justify-content:center; padding:24px; }
.st-card { background:var(--cream); border-radius:24px; padding:28px 24px 24px; max-width:420px; text-align:center; color:var(--ink); }
.st-kicker { font:800 14px Nunito, sans-serif; letter-spacing:2px; text-transform:uppercase; color:var(--tomato); }
.st-title { font:700 30px/1.15 Fraunces, serif; margin:8px 0 12px; }
.st-hint { font:600 16px/1.4 Nunito, sans-serif; color:var(--muted); margin-bottom:20px; }
#b-start { display:block; width:100%; height:60px; border:0; border-radius:16px; background:var(--tomato); color:#fff; font:800 22px Nunito, sans-serif; cursor:pointer; }
#b-reset { display:block; width:100%; margin-top:10px; height:44px; border:0; background:none; color:var(--muted); font:700 16px Nunito, sans-serif; text-decoration:underline; cursor:pointer; }
</style></head>
<body>
<div id="stage"><div id="bar"></div><div id="subs"></div></div>
<script>
// Flat, top-down kitchen drawings for the orzo recipe. Pure string builders (SVG markup), viewBox 0 0 1000 760.
// Timing attributes are read by the player: data-in / data-out = "step", "step+ms" or "step@fraction of speech".
(function () {
  const rng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const f = n => Math.round(n * 10) / 10;
  const svg = (body, vb = '0 0 1000 760') => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  const A = (i, o, fx, body) => `<g class="a"${i != null ? ` data-in="${i}"` : ''}${o != null ? ` data-out="${o}"` : ''}${fx ? ` data-fx="${fx}"` : ''}>${body}</g>`;
  const Lp = (kind, ph, body, o) => `<g class="${kind === 'sway' ? 'sw' : 'lp'}" data-loop="${kind}" data-ph="${ph}"${o ? ` data-o="${o}"` : ''}>${body}</g>`;
  const at = (x, y, r, body, s) => `<g transform="translate(${f(x)} ${f(y)})${r ? ` rotate(${f(r)})` : ''}${s && s !== 1 ? ` scale(${s})` : ''}">${body}</g>`;
  // n points inside an ellipse, at least `min` apart
  const scatter = (n, cx, cy, rx, ry, seed, min) => { const r = rng(seed), pts = []; let tries = 0;
    while (pts.length < n && tries++ < n * 500) { const a = r() * 6.2832, d = Math.sqrt(r()), x = cx + Math.cos(a) * d * rx, y = cy + Math.sin(a) * d * ry;
      if (pts.every(p => (p.x - x) ** 2 + (p.y - y) ** 2 > min * min)) pts.push({ x, y, r: r() * 360 }); }
    return pts; };
  const put = (pts, shape, s) => pts.map((p, i) => at(p.x, p.y, p.r, typeof shape === 'function' ? shape(p, i) : shape, s)).join('');
  // show the points in a few groups, one after the other
  const stag = (pts, step, f0, f1, fx, shape, out = null, groups = 6, s = 1) => { const n = Math.min(groups, pts.length); let h = '';
    for (let g = 0; g < n; g++) h += A(`${step}@${(f0 + (f1 - f0) * g / n).toFixed(2)}`, out, fx, put(pts.filter((_, i) => i % n === g), shape, s));
    return h; };

  // ---------- shapes (drawn around 0,0) ----------
  const board = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="40" fill="#DDAE6C" stroke="#B98545" stroke-width="6"/>
    <path d="M${x + 60} ${y + h * 0.3} H${x + w - 110} M${x + 90} ${y + h * 0.64} H${x + w - 50}" stroke="#CF9C58" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="${x + w - 52}" cy="${y + 52}" r="16" fill="#FBF3E4" stroke="#B98545" stroke-width="5"/>`;
  const knife = `<rect x="-120" y="-17" width="128" height="34" rx="12" fill="#5B3A26"/><circle cx="-90" cy="0" r="4" fill="#C9A27A"/><circle cx="-40" cy="0" r="4" fill="#C9A27A"/>
    <path d="M0 -20 H170 Q232 -8 250 22 H0 Z" fill="#E3E8EC" stroke="#9AA3AD" stroke-width="4" stroke-linejoin="round"/>`;
  const breast = `<path d="M-92 -8 C-92 -62 -30 -78 28 -62 C84 -46 108 0 88 44 C66 84 -10 78 -56 56 C-82 42 -92 20 -92 -8 Z" fill="#F6BBA9" stroke="#E39C8A" stroke-width="6"/>
    <path d="M-58 -30 C-30 -48 10 -46 40 -30" stroke="#FBD6CA" stroke-width="8" stroke-linecap="round" fill="none"/>`;
  const pieceRaw = `<rect x="-26" y="-21" width="52" height="42" rx="15" fill="#F6BBA9" stroke="#E39C8A" stroke-width="4"/><path d="M-12 -9 H8" stroke="#FBD6CA" stroke-width="6" stroke-linecap="round"/>`;
  const pieceGold = `<rect x="-26" y="-21" width="52" height="42" rx="15" fill="#E0A650" stroke="#B5762A" stroke-width="4"/><path d="M-14 -7 L10 -11 M-12 7 L13 3" stroke="#A8651F" stroke-width="5" stroke-linecap="round"/>`;
  const specks = `<circle cx="-11" cy="-8" r="3" fill="#B5451F"/><circle cx="8" cy="5" r="3" fill="#4F7A2A"/><circle cx="13" cy="-10" r="2.6" fill="#3B3531"/><circle cx="-6" cy="10" r="2.6" fill="#B5451F"/><circle cx="1" cy="-2" r="2.4" fill="#4F7A2A"/>`;
  const onionHalf = `<circle r="74" fill="#F4E3B5" stroke="#D29A45" stroke-width="8"/><circle r="52" fill="none" stroke="#E2C58A" stroke-width="5"/><circle r="32" fill="none" stroke="#E2C58A" stroke-width="5"/><circle r="12" fill="#E2C58A"/>`;
  const dice = `<rect x="-9" y="-9" width="18" height="18" rx="4" fill="#FBF3D6" stroke="#DCC27F" stroke-width="2.5"/>`;
  const clove = `<path d="M0 -30 C20 -14 22 14 0 28 C-22 14 -20 -14 0 -30 Z" fill="#FFF8E8" stroke="#D2BE95" stroke-width="4"/><path d="M0 -18 V14" stroke="#E6D7B4" stroke-width="3" stroke-linecap="round"/>`;
  const mince = `<rect x="-5.5" y="-4.5" width="11" height="9" rx="2.5" fill="#FFF6DC" stroke="#D2BE95" stroke-width="2"/>`;
  const sdt = `<ellipse rx="34" ry="23" fill="#B8321F" stroke="#8B2213" stroke-width="4"/><path d="M-20 -6 C-8 -12 6 -2 20 -8 M-18 8 C-4 2 8 12 20 6" stroke="#8B2213" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  const strip = `<rect x="-13" y="-5.5" width="26" height="11" rx="5" fill="#C43A24" stroke="#8B2213" stroke-width="2.5"/>`;
  const grain = `<ellipse rx="11.5" ry="4.8" fill="#FFF1C4" stroke="#DDC077" stroke-width="1.8"/>`;
  const leaf = `<path d="M0 -44 C32 -30 36 14 0 46 C-36 14 -32 -30 0 -44 Z" fill="#62A03C" stroke="#3F6F22" stroke-width="4"/><path d="M0 -32 V38 M0 -8 L14 -20 M0 8 L-14 -4 M0 20 L12 10" stroke="#3F6F22" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  const wilted = `<path d="M-4 -24 C22 -22 26 6 6 24 C-20 20 -26 -8 -4 -24 Z" fill="#3F7A28" stroke="#2A5318" stroke-width="3.5"/><path d="M-2 -14 C4 -2 4 8 4 16" stroke="#2A5318" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  const fleck = `<rect x="-6" y="-2.5" width="12" height="5" rx="2" fill="#FFF8D6" stroke="#E0C56E" stroke-width="1.5"/>`;
  const skillet = (cx, cy, r) => `<rect x="${cx + r - 14}" y="${cy - 24}" width="250" height="48" rx="22" fill="#2B2826"/><circle cx="${cx + r + 200}" cy="${cy}" r="9" fill="#FBF3E4"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#35322F"/><circle cx="${cx}" cy="${cy}" r="${r - 24}" fill="#4C4845"/>
    <path d="M${cx - r + 62} ${cy - 70} A${r - 62} ${r - 62} 0 0 1 ${cx - 70} ${cy - r + 62}" stroke="#625D59" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  const pot = (cx, cy, r) => `<rect x="${cx - r - 52}" y="${cy - 38}" width="80" height="76" rx="22" fill="#8C8379"/><rect x="${cx + r - 28}" y="${cy - 38}" width="80" height="76" rx="22" fill="#8C8379"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#A69D92"/><circle cx="${cx}" cy="${cy}" r="${r - 22}" fill="#D3CBC0"/><circle cx="${cx}" cy="${cy}" r="${r - 26}" fill="none" stroke="#BDB4A8" stroke-width="8"/>`;
  const spoon = `<rect x="-300" y="-10" width="300" height="20" rx="10" fill="#C98C4E" stroke="#9A6431" stroke-width="4"/><ellipse cx="-338" cy="0" rx="46" ry="32" fill="#D59A5C" stroke="#9A6431" stroke-width="4"/><ellipse cx="-342" cy="0" rx="28" ry="18" fill="#C28447"/>`;
  const stir = ph => Lp('sway', ph, at(830, 650, 37, spoon), '830,650');
  const shaker = color => `<rect x="-30" y="-50" width="60" height="84" rx="12" fill="${color}" stroke="#4A2C1A" stroke-width="4"/><rect x="-22" y="-32" width="44" height="34" rx="6" fill="#FFFDF7" opacity=".9"/>
    <rect x="-33" y="34" width="66" height="20" rx="6" fill="#9A9590" stroke="#4A2C1A" stroke-width="4"/>`;
  // a shaker tipped over the food, with falling dots
  const shake = (x, y, color, dot, ph) => Lp('shake', ph, at(x, y, 0, shaker(color))) +
    [0, 1, 2, 3].map(i => Lp('fall', f(ph / 7 + i * 0.25), `<circle cx="${x - 18 + i * 12}" cy="${y + 66}" r="4.5" fill="${dot}"/>`)).join('');
  const flame = lit => `<path d="M0 -17 C10 -7 14 1 10 10 C7 18 -7 18 -10 10 C-13 3 -8 -1 -6 -6 C-3 -3 -1 -2 0 -17 Z" fill="${lit ? '#E9772B' : '#E8D9BC'}"/>`;
  const heat = (n, label) => at(24, 18, 0, `<rect width="${172 + label.length * 17}" height="64" rx="32" fill="#FFFDF7" stroke="#E8D9BC" stroke-width="4"/>${[0, 1, 2].map(i => at(42 + i * 34, 34, 0, flame(i < n))).join('')}
    <text x="146" y="43" font-size="30" font-weight="800" fill="#4A2C1A">${label}</text>`);
  const thermo = `<path d="M0 0 L-118 92" stroke="#9AA3AD" stroke-width="10" stroke-linecap="round"/><circle r="64" fill="#FFFDF7" stroke="#4A2C1A" stroke-width="6"/>
    <text y="0" text-anchor="middle" font-size="34" font-weight="900" fill="#D8432E">165°F</text><text y="30" text-anchor="middle" font-size="21" font-weight="800" fill="#8A6E57">inside</text>`;
  const carton = (color, band, label) => `<path d="M-50 -90 L-30 -122 H30 L50 -90 Z" fill="${color}" stroke="#4A2C1A" stroke-width="5" stroke-linejoin="round"/><rect x="-50" y="-90" width="100" height="162" rx="6" fill="${color}" stroke="#4A2C1A" stroke-width="5"/>
    <rect x="-50" y="-56" width="100" height="62" fill="${band}"/><text y="-14" text-anchor="middle" font-size="27" font-weight="900" fill="#fff">${label}</text><rect x="-50" y="-90" width="100" height="162" rx="6" fill="none" stroke="#4A2C1A" stroke-width="5"/>`;
  // a carton tipped at the top right, with a stream into the pot
  const pour = (step, color, band, label, stream, f0 = 0.15, f1 = 0.9) => A(String(step), String(step + 1), 'slide', at(842, 152, -50, carton(color, band, label))) +
    A(`${step}@${f0}`, `${step}@${f1}`, null, `<path d="M731 98 Q 690 120 664 300" stroke="${stream}" stroke-width="22" stroke-linecap="round" fill="none"/>`);

  const beep = () => { if (!actx) return; const now = actx.currentTime;
    for (let i = 0; i < 3; i++) { const o = actx.createOscillator(), g = actx.createGain(), a = now + i * 0.45; o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, a); g.gain.exponentialRampToValueAtTime(0.5, a + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, a + 0.35); o.start(a); o.stop(a + 0.4); } };

  const curMs = () => { const s = STOPS[idx]; return playing ? Math.min(s.at + performance.now() - t0, s.end - 30) : s.end - 30; };
  const pump = ms => { const s = STOPS[idx], tStep = ms - s.at, ls = s.step.lines;
    while (linesDone < ls.length && tStep >= ls[linesDone].start) { const l = ls[linesDone++]; if (l.file) { audio.src = l.file; audio.play().catch(() => {}); } }
    if (ms >= s.end - 30) { playing = false; root.classList.add('wait'); } };
  const buttons = () => { bBack.disabled = idx === 0; bNext.disabled = idx === STOPS.length - 1; bNext.textContent = idx === STOPS.length - 1 ? 'Done' : 'Next'; };
  const go = i => { idx = clamp(i, 0, STOPS.length - 1); store.idx = idx; save(); linesDone = 0; t0 = performance.now(); playing = true; root.classList.remove('wait');
    audio.pause(); pump(STOPS[idx].at); buttons();
    const nx = STOPS[idx + 1]; if (nx && location.protocol.startsWith('http')) nx.step.lines.forEach(l => l.file && fetch(l.file).catch(() => {})); };
  const next = () => { if (idx < STOPS.length - 1) go(idx + 1); };
  const back = () => { if (idx > 0) go(idx - 1); };

  // timers
  const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let lastTick = 0;
  const drawTray = () => { tray.replaceChildren(...Object.entries(store.timers).map(([id, t]) => {
    const c = $('<div class="tchip"><span class="tl"></span><b></b><button aria-label="Stop timer">×</button></div>'); c.dataset.id = id; c.querySelector('.tl').textContent = t.label; return c; })); lastTick = 0; };
  const startTimer = d => { if (store.timers[d.id]) return; store.timers[d.id] = { label: d.label, min: d.min, max: d.max, end: Date.now() + d.min * 60000, rung: false }; save(); drawTray(); fit(); };
  tray.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; delete store.timers[b.parentElement.dataset.id]; save(); drawTray(); fit(); });
  const timersTick = now => {
    if (now - lastTick < 250) return; lastTick = now; const wall = Date.now();
    tray.querySelectorAll('.tchip').forEach(c => { const t = store.timers[c.dataset.id]; if (!t) return; const left = t.end - wall;
      if (left <= 0 && !t.rung) { t.rung = true; save(); beep(); if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); }
      c.classList.toggle('rung', left <= 0); c.querySelector('.tl').textContent = left <= 0 ? t.label + ': check now' : t.label; c.querySelector('b').textContent = left > 0 ? fmt(left) : '+' + fmt(-left); });
    if (cur) cur.el.querySelectorAll('.timer').forEach(card => { const d = JSON.parse(card.dataset.timer), t = store.timers[d.id], live = card.querySelector('.tm-live'), arc = card.querySelector('.arc');
      if (!t) { live.textContent = 'Tap to start the timer'; arc.setAttribute('stroke-dashoffset', 100); return; }
      const left = t.end - wall; live.textContent = left > 0 ? fmt(left) + ' left' : 'Time is up. Check it.'; arc.setAttribute('stroke-dashoffset', (100 * clamp(left / (t.min * 60000))).toFixed(1)); });
  };

  // checklist
  document.querySelectorAll('.ck').forEach(c => c.classList.toggle('done', !!store.ck[c.dataset.ck]));
  stage.addEventListener('click', e => {
    const ck = e.target.closest('.ck'); if (ck) { const on = !ck.classList.contains('done'); ck.classList.toggle('done', on); if (on) store.ck[ck.dataset.ck] = 1; else delete store.ck[ck.dataset.ck]; save(); return; }
    const tm = e.target.closest('.timer'); if (tm) { startTimer(JSON.parse(tm.dataset.timer)); return; }
    next();
  });
  bNext.addEventListener('click', next); bBack.addEventListener('click', back); bRep.addEventListener('click', () => go(idx));
  document.addEventListener('keydown', e => { if (!started) return;
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') back(); else if (e.key === 'r' || e.key === 'R') go(idx); });
  const begin = from => { started = true; startEl.remove();
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    lock(); go(from); };
  startEl.querySelector('#b-start').addEventListener('click', () => begin(idx));
  const rs = startEl.querySelector('#b-reset'); if (rs) rs.addEventListener('click', () => { store.ck = {}; store.timers = {}; document.querySelectorAll('.ck').forEach(c => c.classList.remove('done')); drawTray(); begin(0); });

  drawTray(); fit(); buttons();
  const frame = now => { const ms = curMs(); if (playing) pump(ms); seek(ms, now); timersTick(now); requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
  window.READY = true;
})();
</script>
</body></html>
